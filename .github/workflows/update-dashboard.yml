name: Build and deploy Track Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/update-dashboard.yml'
      - 'index.html'
      - 'dashboard.js'
      - 'workspace.js'
      - 'news.js'
      - 'filters.js'
      - 'help.js'
      - 'table-sort.js'
      - 'consistency.js'
      - 'calendar.js'
      - 'duration.js'
      - 'studies.js'
      - 'styles.css'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate consolidated data
        run: python scripts/build_data.py
      - name: Generate trade news context
        run: python scripts/build_news.py --hours 48
      - name: Validate generated dataset
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Assemble website
        run: |
          mkdir -p site/data/reference site/data/news
          cp index.html dashboard.js workspace.js filters.js news.js help.js table-sort.js consistency.js calendar.js duration.js studies.js styles.css site/
          cp data/trades.json site/data/trades.json
          cp data/session-risk.json site/data/session-risk.json
          cp data/news/trade-context.json site/data/news/trade-context.json
          cp data/reference/ticker-profiles.csv data/reference/research-summary.json site/data/reference/
          touch site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 600000
