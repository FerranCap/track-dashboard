name: Build and deploy Track Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/update-dashboard.yml'
      - 'index.html'
      - 'dashboard.js'
      - 'workspace.js'
      - 'watchlist.js'
      - 'watchlist-similar.js'
      - 'journal.js'
      - 'journal.css'
      - 'hotkeys.js'
      - 'hotkeys.css'
      - 'projection.js'
      - 'optimal.js'
      - 'swing.js'
      - 'news.js'
      - 'sec-capital.js'
      - 'filters.js'
      - 'date-fields.js'
      - 'help.js'
      - 'table-sort.js'
      - 'consistency.js'
      - 'calendar.js'
      - 'duration.js'
      - 'studies.js'
      - 'styles.css'
      - 'research.html'
      - 'research.js'
      - 'research.css'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate consolidated data
        run: python scripts/build_data.py
      - name: Generate trade news context
        run: python scripts/build_news.py --hours 48
      - name: Generate SEC capital references
        run: python scripts/build_sec_capital.py
      - name: Validate generated dataset
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Assemble website
        run: |
          mkdir -p site/data/reference site/data/news site/data/hotkeys site/data/sec
          cp index.html dashboard.js workspace.js filters.js news.js help.js table-sort.js consistency.js calendar.js duration.js studies.js styles.css site/
          cp projection.js swing.js optimal.js watchlist.js watchlist-similar.js sec-capital.js site/
          cp journal.js journal.css site/
          cp hotkeys.js hotkeys.css site/
          cp data/hotkeys/*.htk site/data/hotkeys/
          cp date-fields.js site/
          # Research temporarily disabled.
          # cp research.html research.js research.css site/
          # mkdir -p site/data/research
          # cp data/research/*.json site/data/research/
          cp data/trades.json site/data/trades.json
          cp data/session-risk.json site/data/session-risk.json
          cp data/journal.json site/data/journal.json
          cp data/news/trade-context.json site/data/news/trade-context.json
          cp data/sec/*.json site/data/sec/
          cp data/reference/ticker-profiles.csv data/reference/research-summary.json site/data/reference/
          touch site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: site
      - name: Wait for website artifact availability
        uses: actions/github-script@v7
        env:
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          script: |
            const name = process.env.PAGES_ARTIFACT_NAME;
            for (let attempt = 1; attempt <= 12; attempt++) {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100
              });
              const matches = artifacts.filter(artifact => artifact.name === name && !artifact.expired);
              if (matches.length > 1) {
                throw new Error(`Multiple active artifacts named ${name} were found.`);
              }
              if (matches.length === 1) {
                core.info(`Website artifact is available: ${matches[0].id}`);
                return;
              }
              core.info(`Artifact ${name} is not visible yet (${attempt}/12).`);
              if (attempt < 12) await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error(`Artifact ${name} is unavailable after waiting. Check the upload step and rerun all jobs.`);
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 600000
