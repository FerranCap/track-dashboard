name: Build and deploy Track Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/update-dashboard.yml'
      - 'index.html'
      - 'dashboard.js'
      - 'styles.css'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate consolidated data
        run: python scripts/build_data.py
      - name: Validate generated dataset
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Assemble website
        run: |
          mkdir -p site/data
          cp index.html dashboard.js styles.css site/
          cp data/trades.json site/data/trades.json
          touch site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
